doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true

        # Maps the Embedding value object onto a pgvector `vector(N)` column.
        # Requires the `vector` extension in PostgreSQL (created by the migration).
        types:
            embedding: App\Shared\Infrastructure\Doctrine\Type\EmbeddingType
        # Tell DBAL that the DB-reported `vector` column type maps back to our
        # `embedding` type (needed for schema introspection / validation).
        mapping_types:
            vector: embedding
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        # Hexagonal: domain models are pure PHP, mapped via XML in each
        # context's Infrastructure layer (no ORM attributes in the domain).
        auto_mapping: false
        mappings:
            Knowledge:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Knowledge/Infrastructure/Doctrine/mapping'
                prefix: 'App\Knowledge\Domain\Model'
                alias: Knowledge
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
